services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: routeon
    ports:
      - "5432:5432"
    volumes:
      - routeon_pgdata:/var/lib/postgresql/data

volumes:
  routeon_pgdata:
